spring.application.name=backend

# ── Database Configuration (Neon PostgreSQL) ────────────────
# All sensitive values are loaded from environment variables.
# Set these in your shell / IDE run config / deployment environment:
#   DB_URL      = jdbc:postgresql://<host>/<db>?sslmode=require&channel_binding=require
#   DB_USERNAME = neondb_owner
#   DB_PASSWORD = <your password>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ─────────────────────────────────────────
# Note: dialect is intentionally omitted — Hibernate 7 auto-detects PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ----- JWT Configuration -----
jwt.secret = ${JWT_SECRET}
jwt.expiration = 86400000