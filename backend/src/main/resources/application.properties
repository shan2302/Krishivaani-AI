spring.application.name=backend

# ── Database Configuration (Neon PostgreSQL) ────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ----- JWT Configuration -----
jwt.secret = ${JWT_SECRET}
jwt.expiration = 86400000


# Spring AI - Groq (OpenAI Compatible) Configuration for Chat
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.3

# Spring AI - Gemini (OpenAI Compatible) Configuration for Embeddings
spring.ai.openai.embedding.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.openai.embedding.model=gemini-embedding-2-preview
spring.ai.openai.embedding.dimensions=1536

# PgVector Store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=agricultural_vectors