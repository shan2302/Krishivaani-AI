<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .h{font:700 19px Arial,sans-serif;fill:#0f172a}
      .t{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 13px Arial,sans-serif;fill:#475569}
      .box{stroke:#334155;stroke-width:2;rx:14;filter:url(#shadow)}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:8 7}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">KrishiVaani AI — Initial System Architecture</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">
    Multilingual agricultural question answering using LLM-only and Retrieval-Augmented Generation (RAG)
  </text>

  <!-- User layer -->
  <rect x="80" y="110" width="1440" height="115" fill="#e0f2fe" class="box"/>
  <text x="800" y="142" text-anchor="middle" class="h">Farmer / User Layer</text>
  <rect x="150" y="160" width="330" height="42" fill="#fff" class="box"/>
  <text x="315" y="187" text-anchor="middle" class="t">Hindi / Kannada / English</text>
  <rect x="635" y="160" width="330" height="42" fill="#fff" class="box"/>
  <text x="800" y="187" text-anchor="middle" class="t">Text or Voice Query</text>
  <rect x="1120" y="160" width="330" height="42" fill="#fff" class="box"/>
  <text x="1285" y="187" text-anchor="middle" class="t">Agricultural Questions</text>

  <!-- Frontend -->
  <rect x="500" y="260" width="600" height="95" fill="#dcfce7" class="box"/>
  <text x="800" y="292" text-anchor="middle" class="h">React Frontend</text>
  <text x="800" y="320" text-anchor="middle" class="t">Web UI • Language Selection • Voice/Text Input • Answer Display</text>
  <text x="800" y="342" text-anchor="middle" class="small">REST communication with Spring Boot backend</text>
  <path d="M800 225 L800 260" class="arrow"/>

  <!-- STT -->
  <rect x="105" y="410" width="390" height="145" fill="#fef3c7" class="box"/>
  <text x="300" y="443" text-anchor="middle" class="h">Voice Processing</text>
  <text x="300" y="472" text-anchor="middle" class="t">Whisper Speech-to-Text</text>
  <text x="300" y="498" text-anchor="middle" class="t">Speech → Text</text>
  <text x="300" y="526" text-anchor="middle" class="small">Multilingual transcription</text>

  <!-- Backend -->
  <rect x="575" y="395" width="450" height="175" fill="#ede9fe" class="box"/>
  <text x="800" y="430" text-anchor="middle" class="h">Spring Boot Backend</text>
  <text x="800" y="458" text-anchor="middle" class="t">REST API + Spring AI</text>
  <text x="800" y="486" text-anchor="middle" class="t">Request Processing &amp; Query Routing</text>
  <text x="800" y="514" text-anchor="middle" class="t">Language-aware Response Handling</text>
  <text x="800" y="542" text-anchor="middle" class="small">Core application/service layer</text>
  <path d="M800 355 L800 395" class="arrow"/>
  <path d="M495 482 L575 482" class="arrow"/>

  <!-- Query routing -->
  <rect x="1165" y="395" width="330" height="175" fill="#fce7f3" class="box"/>
  <text x="1330" y="430" text-anchor="middle" class="h">Query Router</text>
  <text x="1330" y="463" text-anchor="middle" class="t">Research comparison</text>
  <text x="1330" y="492" text-anchor="middle" class="t">LLM-only path</text>
  <text x="1330" y="521" text-anchor="middle" class="t">RAG path</text>
  <text x="1330" y="550" text-anchor="middle" class="small">Same user query → two approaches</text>
  <path d="M1025 482 L1165 482" class="arrow"/>

  <!-- LLM-only -->
  <rect x="1065" y="635" width="365" height="145" fill="#ffedd5" class="box"/>
  <text x="1247" y="670" text-anchor="middle" class="h">LLM-Only Pipeline</text>
  <text x="1247" y="701" text-anchor="middle" class="t">User Query → LLM</text>
  <text x="1247" y="730" text-anchor="middle" class="t">→ Generated Answer</text>
  <text x="1247" y="758" text-anchor="middle" class="small">Baseline for research comparison</text>
  <path d="M1330 570 L1247 635" class="arrow"/>

  <!-- RAG -->
  <rect x="570" y="635" width="410" height="145" fill="#dbeafe" class="box"/>
  <text x="775" y="670" text-anchor="middle" class="h">RAG Pipeline</text>
  <text x="775" y="700" text-anchor="middle" class="t">Query → Retrieve relevant context</text>
  <text x="775" y="728" text-anchor="middle" class="t">→ Build prompt → LLM → Answer</text>
  <text x="775" y="756" text-anchor="middle" class="small">Grounded in verified agricultural knowledge</text>
  <path d="M1330 570 L775 635" class="arrow dashed"/>

  <!-- Knowledge base -->
  <rect x="90" y="635" width="390" height="145" fill="#ecfccb" class="box"/>
  <text x="285" y="670" text-anchor="middle" class="h">Knowledge Base</text>
  <text x="285" y="700" text-anchor="middle" class="t">PostgreSQL + PGVector</text>
  <text x="285" y="728" text-anchor="middle" class="t">Embeddings + Vector Search</text>
  <text x="285" y="756" text-anchor="middle" class="small">Indexed agricultural documents</text>
  <path d="M570 708 L480 708" class="arrow"/>

  <!-- Sources -->
  <rect x="90" y="845" width="390" height="120" fill="#f1f5f9" class="box"/>
  <text x="285" y="879" text-anchor="middle" class="h">Verified Agricultural Sources</text>
  <text x="285" y="909" text-anchor="middle" class="t">Trusted agricultural documents</text>
  <text x="285" y="937" text-anchor="middle" class="t">Curated / processed knowledge</text>
  <path d="M285 780 L285 845" class="arrow"/>

  <!-- Evaluation -->
  <rect x="570" y="845" width="860" height="120" fill="#f3e8ff" class="box"/>
  <text x="1000" y="879" text-anchor="middle" class="h">Research Evaluation</text>
  <text x="1000" y="909" text-anchor="middle" class="t">Compare LLM-only vs RAG responses</text>
  <text x="1000" y="937" text-anchor="middle" class="t">Reliability • Relevance • Accuracy • Hallucination Reduction</text>
  <path d="M1247 780 L1247 820 L1000 820 L1000 845" class="arrow"/>
  <path d="M775 780 L775 820 L1000 820" class="arrow dashed"/>

  <!-- Response flow -->
  <rect x="570" y="995" width="860" height="65" fill="#e2e8f0" class="box"/>
  <text x="1000" y="1022" text-anchor="middle" class="h">Final Response → Spring Boot → React → Farmer</text>
  <text x="1000" y="1047" text-anchor="middle" class="small">Answer returned in the requested language</text>
  <path d="M1000 965 L1000 995" class="arrow"/>

  <!-- Legend -->
  <text x="80" y="1030" class="small">Initial architecture • Week 1 • KV-011</text>
  <text x="80" y="1052" class="small">Scope: multilingual agricultural QA + RAG research comparison</text>
</svg>
